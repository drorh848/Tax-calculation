<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ניהול רישיונות · מנהל כספים וולט</title>
<meta name="theme-color" content="#0d0f14">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161b25;
    --surface2: #1e2535;
    --surface3: #252d3e;
    --border: #2a3347;
    --volt: #c8f400;
    --volt-dim: #8aaa00;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f97316;
    --blue: #3b82f6;
    --text: #e8eaf0;
    --text-muted: #8892a4;
    --text-dim: #5a6478;
    --warn: #fbbf24;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Heebo', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    font-size: 15px;
  }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--volt); color: #0d0f14;
    font-weight: 800; font-size: 19px;
    display: flex; align-items: center; justify-content: center;
  }
  .title { font-size: 16px; font-weight: 700; }
  .subtitle { font-size: 11px; color: var(--text-dim); }

  .main { max-width: 900px; margin: 0 auto; padding: 18px 14px 60px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 14px; font-weight: 700; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--volt); }

  label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
  input, textarea, select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--volt-dim); }
  textarea { resize: vertical; min-height: 62px; }
  .field { margin-bottom: 11px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

  .btn {
    border: none; border-radius: 9px; padding: 10px 15px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn:active { transform: translateY(1px); }
  .btn-volt { background: var(--volt); color: #0d0f14; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-danger { background: transparent; border: 1px solid var(--red); color: var(--red); }
  .btn-sm { padding: 7px 11px; font-size: 12.5px; }
  .row-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }

  .dev-row {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px;
    margin-bottom: 10px;
  }
  .dev-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .dev-name { font-weight: 700; font-size: 15px; }
  .dev-id {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px; letter-spacing: .06em; color: var(--volt);
    direction: ltr; user-select: all;
  }
  .pill {
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
  }
  .pill-on { background: rgba(34,197,94,.15); color: var(--green); }
  .pill-off { background: rgba(239,68,68,.15); color: var(--red); }
  .pill-exp { background: rgba(249,115,22,.15); color: var(--orange); }
  .dev-meta { font-size: 12px; color: var(--text-dim); margin-top: 6px; line-height: 1.7; }

  .hist {
    display: none;
    margin-top: 11px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    max-height: 260px;
    overflow-y: auto;
  }
  .hist.open { display: block; }
  .hist-row {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: 13px; padding: 5px 0;
    border-bottom: 1px solid rgba(42,51,71,.55);
  }
  .hist-row:last-child { border-bottom: none; }
  .hist-date { color: var(--text); }
  .hist-time { color: var(--volt); font-family: ui-monospace, Menlo, Consolas, monospace; direction: ltr; }
  .hist-day { font-size: 11px; color: var(--text-dim); margin: 8px 0 3px; font-weight: 600; }

  .empty { text-align: center; color: var(--text-dim); padding: 26px 10px; font-size: 13.5px; }

  #login-screen {
    position: fixed; inset: 0; z-index: 200;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 22px;
  }
  #login-screen.hidden { display: none; }
  .login-card { width: 100%; max-width: 340px; }

  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(90px);
    background: var(--surface3); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 18px; font-size: 14px;
    transition: transform .25s ease; z-index: 300; max-width: 90vw; text-align: center;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  .err { color: var(--red); font-size: 13px; margin-top: 9px; min-height: 18px; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card card">
    <div class="brand" style="margin-bottom:16px">
      <div class="logo">₪</div>
      <div>
        <div class="title">ניהול רישיונות</div>
        <div class="subtitle">כניסה למנהל בלבד</div>
      </div>
    </div>
    <div class="field">
      <label>אימייל</label>
      <input type="email" id="login-email" autocomplete="username">
    </div>
    <div class="field">
      <label>סיסמה</label>
      <input type="password" id="login-pass" autocomplete="current-password">
    </div>
    <button class="btn btn-volt" style="width:100%" id="login-btn">כניסה</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<div class="header">
  <div class="brand">
    <div class="logo">₪</div>
    <div>
      <div class="title">ניהול רישיונות</div>
      <div class="subtitle" id="admin-email"></div>
    </div>
  </div>
  <div style="display:flex;gap:7px">
    <button class="btn btn-outline btn-sm" id="refresh-btn">🔄 רענן</button>
    <button class="btn btn-outline btn-sm" id="logout-btn">יציאה</button>
  </div>
</div>

<div class="main">

  <div class="card">
    <div class="card-title"><div class="dot"></div>הוספת מכשיר</div>
    <div class="field">
      <label>מזהה מכשיר (הדבק את מה שהמשתמש שלח)</label>
      <input type="text" id="new-id" placeholder="XXXX-XXXX-XXXX" dir="ltr" style="font-family:ui-monospace,monospace;letter-spacing:.08em">
    </div>
    <div class="grid2">
      <div class="field">
        <label>שם / למי זה שייך</label>
        <input type="text" id="new-name" placeholder="למשל: ברכה">
      </div>
      <div class="field">
        <label>תוקף עד (אופציונלי)</label>
        <input type="date" id="new-expires">
      </div>
    </div>
    <button class="btn btn-volt" id="add-btn">➕ הוסף רישיון</button>
  </div>

  <div class="card">
    <div class="card-title"><div class="dot" style="background:var(--blue)"></div>הודעה לכל המשתמשים</div>
    <div class="field">
      <textarea id="global-msg" placeholder="הודעה שתופיע בראש האפליקציה אצל כולם. השאר ריק כדי לבטל."></textarea>
    </div>
    <button class="btn btn-volt btn-sm" id="global-save">💾 שמור הודעה גלובלית</button>
  </div>

  <div class="card">
    <div class="card-title"><div class="dot" style="background:var(--warn)"></div>מכשירים רשומים <span id="count" style="color:var(--text-dim);font-weight:400"></span></div>
    <div id="list"><div class="empty">טוען…</div></div>
  </div>

</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/*
  Owner console. All writes are additionally enforced server-side by the
  database security rules; this UI is a convenience layer, not the boundary.
*/
(function () {
  'use strict';

  /* ---- CONFIGURATION - paste the Firebase web app config here ---- */
  var firebaseConfig = {
    apiKey: 'AIzaSyAClK2d7_rX1I1cT2hZP3v-iwrhbEL687o',
    authDomain: 'volt-license.firebaseapp.com',
    databaseURL: 'https://volt-license-default-rtdb.europe-west1.firebasedatabase.app',
    projectId: 'volt-license',
    storageBucket: 'volt-license.firebasestorage.app',
    messagingSenderId: '352678285329',
    appId: '1:352678285329:web:9d1afbfa2701eb58daa1b0'
  };

  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.database();

  var ID_RE = /^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/;
  var el = function (id) { return document.getElementById(id); };

  function toast(msg) {
    var t = el('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  function todayISO() {
    var d = new Date(), m = String(d.getMonth() + 1), day = String(d.getDate());
    if (m.length < 2) m = '0' + m;
    if (day.length < 2) day = '0' + day;
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function fmtDate(iso) {
    if (!iso) return '';
    var p = String(iso).split('-');
    return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : iso;
  }

  function fmtSeen(ts) {
    if (!ts) return 'טרם התחבר';
    var diff = Date.now() - Number(ts);
    var days = Math.floor(diff / 86400000);
    if (days <= 0) return 'היום';
    if (days === 1) return 'אתמול';
    return 'לפני ' + days + ' ימים';
  }

  /* ---- Authentication ---- */
  el('login-btn').addEventListener('click', function () {
    el('login-err').textContent = '';
    auth.signInWithEmailAndPassword(el('login-email').value.trim(), el('login-pass').value)
      .catch(function (e) { el('login-err').textContent = 'כניסה נכשלה: ' + e.code; });
  });

  el('login-pass').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') el('login-btn').click();
  });

  el('logout-btn').addEventListener('click', function () { auth.signOut(); });

  auth.onAuthStateChanged(function (user) {
    if (user) {
      el('login-screen').classList.add('hidden');
      el('admin-email').textContent = user.email || '';
      load();
    } else {
      el('login-screen').classList.remove('hidden');
    }
  });

  /* ---- Data ---- */
  function load() {
    db.ref('licenses').once('value').then(function (snap) {
      render(snap.val() || {});
    }).catch(function (e) {
      el('list').innerHTML = '<div class="empty">שגיאת קריאה: ' + e.code + '</div>';
    });
    db.ref('global/message').once('value').then(function (s) {
      el('global-msg').value = s.val() || '';
    }).catch(function () {});
  }

  el('refresh-btn').addEventListener('click', load);

  el('add-btn').addEventListener('click', function () {
    var id = el('new-id').value.trim().toUpperCase();
    if (!ID_RE.test(id)) { toast('מזהה לא תקין - נדרש פורמט XXXX-XXXX-XXXX'); return; }
    var rec = {
      active: true,
      name: el('new-name').value.trim() || 'ללא שם',
      expires: el('new-expires').value || '',
      message: '',
      created: Date.now(),
      lastSeen: 0
    };
    db.ref('licenses/' + id).set(rec).then(function () {
      el('new-id').value = '';
      el('new-name').value = '';
      el('new-expires').value = '';
      toast('הרישיון נוסף');
      load();
    }).catch(function (e) { toast('שמירה נכשלה: ' + e.code); });
  });

  el('global-save').addEventListener('click', function () {
    db.ref('global/message').set(el('global-msg').value.trim()).then(function () {
      toast('ההודעה הגלובלית נשמרה');
    }).catch(function (e) { toast('שמירה נכשלה: ' + e.code); });
  });

  /* ---- Rendering ---- */
  function render(all) {
    var ids = Object.keys(all).sort(function (a, b) {
      return String(all[a].name || '').localeCompare(String(all[b].name || ''), 'he');
    });
    el('count').textContent = '(' + ids.length + ')';

    if (!ids.length) {
      el('list').innerHTML = '<div class="empty">אין עדיין מכשירים רשומים.</div>';
      return;
    }

    var wrap = document.createElement('div');
    ids.forEach(function (id) { wrap.appendChild(rowFor(id, all[id] || {})); });
    el('list').innerHTML = '';
    el('list').appendChild(wrap);
  }

  function rowFor(id, rec) {
    var expired = rec.expires && String(rec.expires) < todayISO();
    var row = document.createElement('div');
    row.className = 'dev-row';

    var head = document.createElement('div');
    head.className = 'dev-head';

    var name = document.createElement('span');
    name.className = 'dev-name';
    name.textContent = rec.name || 'ללא שם';

    var pill = document.createElement('span');
    if (rec.active !== true) { pill.className = 'pill pill-off'; pill.textContent = 'חסום'; }
    else if (expired) { pill.className = 'pill pill-exp'; pill.textContent = 'פג תוקף'; }
    else { pill.className = 'pill pill-on'; pill.textContent = 'פעיל'; }

    var idEl = document.createElement('span');
    idEl.className = 'dev-id';
    idEl.textContent = id;

    head.appendChild(name);
    head.appendChild(pill);
    head.appendChild(idEl);
    row.appendChild(head);

    var meta = document.createElement('div');
    meta.className = 'dev-meta';
    meta.textContent =
      'תוקף: ' + (rec.expires ? fmtDate(rec.expires) : 'ללא הגבלה') +
      ' · חיבור אחרון: ' + fmtSeen(rec.lastSeen) +
      (rec.message ? ' · הודעה אישית: ' + rec.message : '');
    row.appendChild(meta);

    /* Inline editors */
    var edit = document.createElement('div');
    edit.className = 'grid2';
    edit.style.marginTop = '11px';

    var fName = field('שם', 'text', rec.name || '');
    var fExp = field('תוקף עד (ריק = ללא הגבלה)', 'date', rec.expires || '');
    edit.appendChild(fName.wrap);
    edit.appendChild(fExp.wrap);
    row.appendChild(edit);

    var fMsg = document.createElement('div');
    fMsg.className = 'field';
    fMsg.style.marginTop = '2px';
    var lbl = document.createElement('label');
    lbl.textContent = 'הודעה אישית למשתמש הזה';
    var ta = document.createElement('textarea');
    ta.value = rec.message || '';
    ta.placeholder = 'למשל: הרישיון שלך מסתיים בעוד חודש';
    fMsg.appendChild(lbl);
    fMsg.appendChild(ta);
    row.appendChild(fMsg);

    var acts = document.createElement('div');
    acts.className = 'row-actions';

    acts.appendChild(button('💾 שמור', 'btn btn-volt btn-sm', function () {
      db.ref('licenses/' + id).update({
        name: fName.input.value.trim() || 'ללא שם',
        expires: fExp.input.value || '',
        message: ta.value.trim()
      }).then(function () { toast('נשמר'); load(); })
        .catch(function (e) { toast('שמירה נכשלה: ' + e.code); });
    }));

    acts.appendChild(button(rec.active === true ? '🚫 חסום' : '✅ הפעל',
      'btn btn-outline btn-sm', function () {
        db.ref('licenses/' + id + '/active').set(rec.active !== true)
          .then(function () { toast(rec.active === true ? 'המכשיר נחסם' : 'המכשיר הופעל'); load(); })
          .catch(function (e) { toast('פעולה נכשלה: ' + e.code); });
      }));

    acts.appendChild(button('🗑️ מחק', 'btn btn-danger btn-sm', function () {
      if (!confirm('למחוק את הרישיון של ' + (rec.name || id) + '? הפעולה אינה הפיכה.')) return;
      db.ref('licenses/' + id).remove()
        .then(function () { toast('נמחק'); load(); })
        .catch(function (e) { toast('מחיקה נכשלה: ' + e.code); });
    }));

    var hist = document.createElement('div');
    hist.className = 'hist';

    acts.appendChild(button('\ud83d\udd52 \u05d4\u05d9\u05e1\u05d8\u05d5\u05e8\u05d9\u05d4', 'btn btn-outline btn-sm', function () {
      if (hist.classList.contains('open')) { hist.classList.remove('open'); return; }
      hist.classList.add('open');
      hist.innerHTML = '<div class="empty">\u05d8\u05d5\u05e2\u05df\u2026</div>';
      db.ref('logs/' + id).limitToLast(100).once('value').then(function (snap) {
        renderHistory(hist, snap.val() || {});
      }).catch(function (e) {
        hist.innerHTML = '<div class="empty">\u05e9\u05d2\u05d9\u05d0\u05ea \u05e7\u05e8\u05d9\u05d0\u05d4: ' + e.code + '</div>';
      });
    }));

    row.appendChild(acts);
    row.appendChild(hist);
    return row;
  }

  /* Visit history: newest first, grouped by day */
  function renderHistory(box, map) {
    var stamps = Object.keys(map).map(function (k) { return Number(map[k]); })
      .filter(function (n) { return n > 0; })
      .sort(function (a, b) { return b - a; });

    if (!stamps.length) {
      box.innerHTML = '<div class="empty">\u05d0\u05d9\u05df \u05e2\u05d3\u05d9\u05d9\u05df \u05db\u05e0\u05d9\u05e1\u05d5\u05ea \u05de\u05ea\u05d5\u05e2\u05d3\u05d5\u05ea.</div>';
      return;
    }

    box.innerHTML = '';
    var head = document.createElement('div');
    head.className = 'hist-day';
    head.textContent = '\u05e1\u05d4"\u05db ' + stamps.length + ' \u05db\u05e0\u05d9\u05e1\u05d5\u05ea \u05d0\u05d7\u05e8\u05d5\u05e0\u05d5\u05ea';
    box.appendChild(head);

    var lastDay = '';
    stamps.forEach(function (ts) {
      var d = new Date(ts);
      var day = pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear();
      var time = pad(d.getHours()) + ':' + pad(d.getMinutes());

      var r = document.createElement('div');
      r.className = 'hist-row';
      var dl = document.createElement('span');
      dl.className = 'hist-date';
      dl.textContent = (day === lastDay) ? '' : day;
      var tl = document.createElement('span');
      tl.className = 'hist-time';
      tl.textContent = time;
      r.appendChild(dl);
      r.appendChild(tl);
      box.appendChild(r);
      lastDay = day;
    });
  }

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function field(labelText, type, value) {
    var wrap = document.createElement('div');
    wrap.className = 'field';
    var l = document.createElement('label');
    l.textContent = labelText;
    var i = document.createElement('input');
    i.type = type;
    i.value = value;
    wrap.appendChild(l);
    wrap.appendChild(i);
    return { wrap: wrap, input: i };
  }

  function button(text, cls, fn) {
    var b = document.createElement('button');
    b.className = cls;
    b.type = 'button';
    b.textContent = text;
    b.addEventListener('click', fn);
    return b;
  }
})();
</script>
</body>
</html>
